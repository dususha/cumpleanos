  <style>

    /* =========================
       ШРИФТЫ
    ========================= */

    @font-face {
      font-family: "Satyr SP";
      src: url("./SatyrSP.otf") format("opentype");
      font-weight: normal;
      font-style: normal;
    }

    @font-face {
      font-family: "UbuntuLI";
      src: url("./Ubuntu-LI.ttf") format("truetype");
      font-weight: normal;
      font-style: normal;
    }


    /* =========================
       ОБЩИЕ НАСТРОЙКИ
    ========================= */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f3eee4;

      cursor: url("./cursor1.png") 16 16, auto;
    }


    /* =========================
       СЦЕНА
    ========================= */

    .scene {
      position: relative;
      width: 100%;
      min-height: 1750px;

      overflow: hidden;

      padding-top: 180px;
    }


    /* =========================
       ЗАГОЛОВОК
    ========================= */

    .title {
      position: absolute;

      top: 35px;
      left: 50%;

      transform: translateX(-50%);

      width: 92%;

      text-align: center;

      z-index: 50;
    }

    .title h1 {
      margin: 0;

      font-family: "Satyr SP", serif;
      font-size: 72px;
      font-weight: normal;
      line-height: 1;
    }

    .title p {
      margin: 10px 0 0;

      font-family: "UbuntuLI", serif;
      font-size: 14px;
      font-weight: normal;
    }


    /* =========================
       ОСНОВНЫЕ КАРТИНКИ
    ========================= */

    .object {
      position: absolute;

      animation:
        float var(--dur, 4s)
        ease-in-out
        infinite;

      z-index: 10;
    }


    /* Кликабельные картинки с видео */

    .object[data-video] {
      cursor: pointer;
    }


    .object img {
      display: block;

      width: 100%;
      height: auto;

      transform:
        rotate(var(--rot, 0deg));

      transition:
        transform 0.25s ease,
        filter 0.25s ease;
    }


    /* При наведении картинка выходит немного вперёд */

    .object:hover {
      z-index: 20;
    }

    .object:hover img {
      transform:
        rotate(var(--rot, 0deg))
        scale(1.12);

      filter:
        drop-shadow(
          0 18px 24px
          rgba(0, 0, 0, 0.25)
        );
    }


    /* Мягкое движение вверх-вниз */

    @keyframes float {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-12px);
      }
    }



    /* =========================
       ПАСХАЛКИ
    ========================= */

    .greeting {
      position: absolute;

      z-index: 30;

      cursor: pointer;

      animation:
        greeting-float
        4s
        ease-in-out
        infinite;
    }


    .greeting img {
      display: block;

      width: 100%;
      height: auto;

      transition:
        transform 0.25s ease,
        filter 0.25s ease;
    }


    /*
      Пасхалка всегда выше основной картинки,
      поэтому на неё можно нажать.
    */

    .greeting:hover {
      z-index: 40;
    }


    /* Активное покачивание при наведении */

    .greeting:hover img {
      animation:
        wiggle
        0.6s
        ease-in-out
        1;

      filter:
        drop-shadow(
          0 8px 10px
          rgba(0, 0, 0, 0.2)
        );
    }


    @keyframes wiggle {

      0% {
        transform:
          rotate(0deg)
          scale(1);
      }

      20% {
        transform:
          rotate(-14deg)
          scale(1.12);
      }

      40% {
        transform:
          rotate(12deg)
          scale(1.12);
      }

      60% {
        transform:
          rotate(-9deg)
          scale(1.12);
      }

      80% {
        transform:
          rotate(6deg)
          scale(1.08);
      }

      100% {
        transform:
          rotate(0deg)
          scale(1);
      }
    }


    @keyframes greeting-float {

      0%,
      100% {
        transform:
          translateY(0);
      }

      50% {
        transform:
          translateY(-6px);
      }
    }

        allowfullscreen>

  <!-- =====================
       JAVASCRIPT
  ====================== -->


  <script>

    const objects =
      document.querySelectorAll(
        "[data-video], [data-message]"
      );


    const modal =
      document.getElementById("modal");


    const video =
      document.getElementById("video");


    const message =
      document.getElementById("message");


    const closeButton =
      document.getElementById("close");



    objects.forEach(object => {

      object.addEventListener(
        "click",
        function () {


          const videoURL =
            object.dataset.video;


          const messageText =
            object.dataset.message;



          /* =====================
             ОТКРЫВАЕМ ВИДЕО
          ====================== */

          if (videoURL) {

            message.style.display =
              "none";

            message.textContent =
              "";


            video.style.display =
              "block";


            video.src =
              videoURL +
              "?autoplay=1";


            modal.classList.add(
              "active"
            );

          }



          /* =====================
             ОТКРЫВАЕМ ПАСХАЛКУ
          ====================== */

          if (messageText) {

            video.src =
              "";


            video.style.display =
              "none";


            message.textContent =
              messageText;


            message.style.display =
              "flex";


            modal.classList.add(
              "active"
            );

          }

        }
      );

    });



    /* =====================
       ЗАКРЫТИЕ
    ====================== */

    function closeModal() {

      modal.classList.remove(
        "active"
      );


      video.src =
        "";


      video.style.display =
        "block";


      message.textContent =
        "";


      message.style.display =
        "none";

    }



    closeButton.addEventListener(
      "click",
      closeModal
    );



    /* Клик по фону */

    modal.addEventListener(
      "click",
      function (event) {

        if (event.target === modal) {

          closeModal();

        }

      }
    );



    /* ESC */

    document.addEventListener(
      "keydown",
      function (event) {

        if (event.key === "Escape") {

          closeModal();

        }

      }
    );

  </script>
