       ШРИФТЫ
    ========================= */

    /* =========================
       ОБЩИЕ НАСТРОЙКИ
    ========================= */

    * {
      box-sizing: border-box;
    }

    html,

      margin: 0;
      width: 100%;
      min-height: 100%;
    }

       СЦЕНА
    ========================= */

      position: relative;
      width: 100%;
      min-height: 1300px;

      padding-top: 180px;
    }


    /* =========================
       ЗАГОЛОВОК
    ========================= */

    .title {
      position: absolute;
      top: 35px;
      left: 50%;
      transform: translateX(-50%);
      width: 92%;
      text-align: center;
      z-index: 50;
    }

    .title h1 {

      font-weight: normal;
      line-height: 1;

    .title p {

      font-size: 14px;
      font-weight: normal;
    }


    /* =========================
       ОСНОВНЫЕ КАРТИНКИ
    ========================= */

    .object {
      position: absolute;
      z-index: 10;

      animation:
        float var(--dur, 4s)
        ease-in-out
        infinite;
    }

    .object[data-video] {
      cursor: pointer;
    }

    .object img {
      display: block;
      width: 100%;
      height: auto;

      transform:
        rotate(var(--rot, 0deg));

      transition:
        transform 0.25s ease,
        filter 0.25s ease;
    }

    .object:hover {
      z-index: 20;
    }

    .object:hover img {
      transform:
        rotate(var(--rot, 0deg))
        scale(1.12);

      filter:
        drop-shadow(
          0 18px 24px
          rgba(0, 0, 0, 0.25)
        );
    }


    @keyframes float {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-12px);
      }

    }


    /* =========================
       ПАСХАЛКИ
    ========================= */

    .greeting {
      position: absolute;
      z-index: 30;
      cursor: pointer;

      animation:
        greeting-float
        4s
        ease-in-out
        infinite;
    }

    .greeting img {
      display: block;
      width: 100%;
      height: auto;

      transition:
        transform 0.25s ease,
        filter 0.25s ease;
    }

    .greeting:hover {
      z-index: 40;
    }

    .greeting:hover img {
      animation:
        wiggle
        0.6s
        ease-in-out
        1;

      filter:
        drop-shadow(
          0 8px 10px
          rgba(0, 0, 0, 0.2)
        );
    }


    @keyframes wiggle {

      0% {
        transform:
          rotate(0deg)
          scale(1);
      }

      20% {
        transform:
          rotate(-14deg)
          scale(1.12);
      }

      40% {
        transform:
          rotate(12deg)
          scale(1.12);
      }

      60% {
        transform:
          rotate(-9deg)
          scale(1.12);
      }

      80% {
        transform:
          rotate(6deg)
          scale(1.08);
      }

      100% {
        transform:
          rotate(0deg)
          scale(1);
      }

    }


    @keyframes greeting-float {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-6px);
      }

    }

        src=""
        title="Видео-поздравление"
        allow="autoplay; encrypted-media; picture-in-picture"
        allowfullscreen>
      </iframe>

  <!-- =====================
       JAVASCRIPT
  ====================== -->

  <script>

    const objects =
      document.querySelectorAll(
        "[data-video], [data-message]"
      );


    const modal =
      document.getElementById("modal");


    const video =
      document.getElementById("video");


    const message =
      document.getElementById("message");


    const closeButton =
      document.getElementById("close");



    objects.forEach(object => {

      object.addEventListener(
        "click",
        function () {


          const videoURL =
            object.dataset.video;


          const messageText =
            object.dataset.message;



          /* =====================
             ВИДЕО
          ====================== */

          if (videoURL) {

            message.style.display =
              "none";

            message.textContent =
              "";


            video.style.display =
              "block";


            video.src =
              videoURL +
              "?autoplay=1";


            modal.classList.add(
              "active"
            );

          }



          /* =====================
             ПАСХАЛКА
          ====================== */

          if (messageText) {

            video.src =
              "";


            video.style.display =
              "none";


            message.textContent =
              messageText;


            message.style.display =
              "flex";


            modal.classList.add(
              "active"
            );

          }

        }
      );

    });



    /* =====================
       ЗАКРЫТИЕ
    ====================== */

    function closeModal() {

      modal.classList.remove(
        "active"
      );


      video.src =
        "";


      video.style.display =
        "block";


      message.textContent =
        "";


      message.style.display =
        "none";

    }



    closeButton.addEventListener(
      "click",
      closeModal
    );



    modal.addEventListener(
      "click",
      function (event) {

        if (event.target === modal) {

          closeModal();

        }

      }
    );



    document.addEventListener(
      "keydown",
      function (event) {

        if (event.key === "Escape") {

          closeModal();

        }

      }
    );

  </script>
