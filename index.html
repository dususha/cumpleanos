<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Светлоликая Светлана</title>

  <style>

    @font-face {
      font-family: "Satyr SP";
      src: url("./SatyrSP.otf") format("opentype");
      font-weight: normal;
      font-style: normal;
    }

    @font-face {
      font-family: "UbuntuLI";
      src: url("./Ubuntu-LI.ttf") format("truetype");
      font-weight: normal;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

  body {
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: #f3eee4;
  cursor: url("./cursor1.png") 16 16, auto;
}
.object[data-video],
.greeting[data-message] {
  cursor: url("./cursor-click.png") 16 16, pointer;
}
    .scene {
      position: relative;
      width: 100%;
      min-height: 1750px;
      overflow: hidden;
      padding-top: 180px;
    }

    .title {
      position: absolute;
      top: 35px;
      left: 50%;
      transform: translateX(-50%);
      width: 92%;
      text-align: center;
      z-index: 50;
    }

    .title h1 {
      margin: 0;
      font-family: "Satyr SP", serif;
      font-size: 72px;
      font-weight: normal;
      line-height: 1;
    }

    .title p {
      margin: 10px 0 0;
      font-family: "UbuntuLI", serif;
      font-size: 14px;
      font-weight: normal;
    }

    /* ОСНОВНЫЕ КАРТИНКИ */

    .object {
      position: absolute;
      z-index: 1;
      animation: float var(--dur, 4s) ease-in-out infinite;
    }

    .object[data-video] {
      cursor: pointer;
    }

    .object img {
      display: block;
      width: 100%;
      height: auto;
      transform: rotate(var(--rot, 0deg));
      transition:
        transform 0.25s ease,
        filter 0.25s ease;
    }

    .object:hover {
      z-index: 999;
    }

    .object:hover img {
      transform: rotate(var(--rot, 0deg)) scale(1.15);
      filter: drop-shadow(0 18px 24px rgba(0, 0, 0, 0.25));
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-14px);
      }
    }


    /* ПРИВЕТЫ С ОЛИМПА */

    .greeting {
      position: absolute;
      z-index: 30;
      cursor: pointer;
      animation: greeting-float 4s ease-in-out infinite;
    }

    .greeting img {
      display: block;
      width: 100%;
      height: auto;
      transition:
        transform 0.25s ease,
        filter 0.25s ease;
    }

    .greeting:hover {
      z-index: 1001;
    }

    .greeting:hover img {
      transform: scale(1.22);
      filter: drop-shadow(0 8px 10px rgba(0, 0, 0, 0.2));
    }

    @keyframes greeting-float {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-6px);
      }
    }

    .luck {
      width: 55px;
      left: 11%;
      top: 470px;
      animation-duration: 3.4s;
    }

    .love {
      width: 60px;
      left: 34%;
      top: 500px;
      animation-duration: 4.1s;
    }

    .rest {
      width: 50px;
      left: 54%;
      top: 820px;
      animation-duration: 3.7s;
    }

    .joy {
      width: 58px;
      left: 75%;
      top: 610px;
      animation-duration: 4.4s;
    }

    .adventure {
      width: 60px;
      left: 27%;
      top: 930px;
      animation-duration: 3.9s;
    }


    /* 16 КАРТИНОК */

    .eos {

      --rot: -8deg;

    }

    .hestia {
      width: 325px;
      left: 17%;

      z-index: 8;
      --rot: 7deg;
      --dur: 4.3s;
    }

    .artemis {
      width: 230px;
      left: 30%;
      top: 220px;
      z-index: 5;

      --dur: 3.9s;
    }

    .hera {
      width: 210px;

      z-index: 9;

      --dur: 4.8s;
    }

    .demeter {
      width: 235px;
      left: 56%;

      z-index: 6;
      --rot: -9deg;
      --dur: 4.1s;
    }

    .persephone {
      width: 220px;
      left: 69%;
      top: 350px;
      z-index: 10;
      --rot: 6deg;
      --dur: 3.6s;
    }

    .themis {
      width: 305px;
      left: 71%;
      top: 215px;
      z-index: 7;
      --rot: -7deg;
      --dur: 4.6s;
    }

    .selene {
      width: 215px;
      left: 8%;
      top: 540px;
      z-index: 11;
      --rot: 9deg;
      --dur: 3.8s;
    }

    .hecate {
      width: 225px;
      left: 23%;
      top: 700px;
      z-index: 7;
      --rot: -10deg;
      --dur: 4.5s;
    }

    .nike {
      width: 210px;
      left: 38%;
      top: 560px;
      z-index: 12;
      --rot: 5deg;
      --dur: 3.5s;
    }

    .iris {
      width: 230px;
      left: 50%;
      top: 720px;
      z-index: 8;
      --rot: -6deg;
      --dur: 4.7s;
    }

    .circe {
      width: 220px;
      left: 65%;
      top: 560px;
      z-index: 13;
      --rot: 11deg;
      --dur: 3.9s;
    }

    .calypso {
      width: 235px;
      left: 78%;
      top: 730px;
      z-index: 9;
      --rot: -8deg;
      --dur: 4.4s;
    }

    .cassandra {
      width: 215px;
      left: 12%;
      top: 930px;
      z-index: 10;
      --rot: 8deg;
      --dur: 3.7s;
    }

    .apollo {
      width: 240px;
      left: 35%;
      top: 1030px;
      z-index: 14;
      --rot: -4deg;
      --dur: 4.2s;
    }

    .hermes {
      width: 220px;
      left: 63%;
      top: 960px;
      z-index: 11;
      --rot: 7deg;
      --dur: 3.8s;
    }


    /* МОДАЛЬНОЕ ОКНО */

    .modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 30px;
      background: rgba(0, 0, 0, 0.84);
      z-index: 1000;
    }

    .modal.active {
      display: flex;
    }

    .video-box {
  position: relative;
  width: min(900px, 92vw);
  aspect-ratio: 16 / 9;
  background: #1f1b18;
  display: flex;
  align-items: center;
  justify-content: center;
}

.video-box iframe {
  width: 100%;
  height: 100%;
  border: 0;
}

#message {
  display: none;
  width: 100%;
  height: 100%;

  background: #1f1b18;
  color: #c96b32;

  font-family: "Satyr SP", serif;
  font-size: 42px;
  line-height: 1.25;
  text-align: center;

  padding: 50px;

  align-items: center;
  justify-content: center;

  border: 6px solid #b85f2d;
}

.close {
  position: absolute;
  top: -50px;
  right: 0;
  border: 0;
  background: transparent;
  color: #c96b32;
  font-size: 42px;
  line-height: 1;
  cursor: pointer;
}


    /* МОБИЛЬНАЯ ВЕРСИЯ */

    @media (max-width: 700px) {

      .scene {
        min-height: 3000px;
        padding-top: 160px;
      }

      .title {
        top: 22px;
      }

      .title h1 {
        font-size: 48px;
      }

      .title p {
        font-size: 18px;
      }

      #message {
  font-size: 28px;
  padding: 30px;
  line-height: 1.3;
}

      .eos {
        width: 180px;
        left: 4%;
        top: 180px;
      }

      .hestia {
        width: 250px;
        left: 46%;
        top: 240px;
      }

      .artemis {
        width: 145px;
        left: 18%;
        top: 360px;
      }

      .hera {
        width: 140px;
        left: 58%;
        top: 430px;
      }

      .demeter {
        width: 150px;
        left: 6%;
        top: 560px;
      }

      .persephone {
        width: 145px;
        left: 45%;
        top: 640px;
      }

      .themis {
        width: 235px;
        left: 15%;
        top: 790px;
      }

      .selene {
        width: 145px;
        left: 58%;
        top: 860px;
      }

      .hecate {
        width: 150px;
        left: 8%;
        top: 1010px;
      }

      .nike {
        width: 140px;
        left: 46%;
        top: 1100px;
      }

      .iris {
        width: 150px;
        left: 18%;
        top: 1260px;
      }

      .circe {
        width: 145px;
        left: 58%;
        top: 1350px;
      }

      .calypso {
        width: 150px;
        left: 8%;
        top: 1520px;
      }

      .cassandra {
        width: 145px;
        left: 46%;
        top: 1600px;
      }

      .apollo {
        width: 155px;
        left: 20%;
        top: 1770px;
      }

      .hermes {
        width: 145px;
        left: 58%;
        top: 1870px;
      }

      /* Пасхалки на телефоне */

      .luck {
        width: 42px;
        left: 10%;
        top: 330px;
      }

      .love {
        width: 45px;
        left: 77%;
        top: 520px;
      }

      .rest {
        width: 40px;
        left: 38%;
        top: 970px;
      }

      .joy {
        width: 45px;
        left: 76%;

      }

      .adventure {
        width: 44px;
        left: 8%;

    }

  </style>
</head>

<body>

  <main class="scene">

    <div class="title">
      <h1>С днём рождения!</h1>
      <p>Добрые речи подруг и друзей здесь Светлане Светлоликой с любовью собраны</p>
    </div>


    <!-- ПРИВЕТЫ С ОЛИМПА -->

    <div
      class="greeting luck"
      data-message="🍀 О, да сопутствует случай тебе благосклонный"
    >
      <img src="./luck.png" alt="Luck">
    </div>

    <div
      class="greeting love"
      data-message="💘 Да умножит Киприда любовь и веселье"
    >
      <img src="./love.png" alt="Love">
    </div>

    <div
      class="greeting rest"
      data-message="🌙 Сладостен сон; почивай же без всякой тревоги"
    >
      <img src="./rest.png" alt="Rest">
    </div>

    <div
      class="greeting joy"
      data-message="✨ Смех да пребудет с тобой, и пиры, и отрада"
    >
      <img src="./joy.png" alt="Joy">
    </div>

    <div
      class="greeting adventure"
      data-message="🏺 Странствуй отважно, но мимо циклопов по возможности"
    >
      <img src="./adventure.png" alt="Adventure">
    </div>


    <!-- ОСНОВНЫЕ КАРТИНКИ -->

    <div
      class="object eos"
      data-video="https://www.youtube.com/embed/n92WoYu_kIg"
    >
      <img src="./eos.png" alt="Eos">
    </div>

    <div
      class="object themis"
      data-video="https://www.youtube.com/embed/sWfOfMFYXu8"
    >
      <img src="./themis.png" alt="Themis">
    </div>

    <div class="object artemis">
      <img src="./artemis.png" alt="Artemis">
    </div>

    <div class="object hera">
      <img src="./hera.png" alt="Hera">
    </div>

    <div class="object demeter">
      <img src="./demeter.png" alt="Demeter">
    </div>

    <div class="object persephone">
      <img src="./persephone.png" alt="Persephone">
    </div>

    <div
      class="object hestia"
      data-video="https://www.youtube.com/embed/rIFX2fCCWto"
    >
      <img src="./hestia.png" alt="Hestia">
    </div>

    <div class="object selene">
      <img src="./selene.png" alt="Selene">
    </div>

    <div class="object hecate">
      <img src="./hecate.png" alt="Hecate">
    </div>

    <div class="object nike">
      <img src="./nike.png" alt="Nike">
    </div>

    <div class="object iris">
      <img src="./iris.png" alt="Iris">
    </div>

    <div class="object circe">
      <img src="./circe.png" alt="Circe">
    </div>

    <div class="object calypso">
      <img src="./calypso.png" alt="Calypso">
    </div>

    <div class="object cassandra">
      <img src="./cassandra.png" alt="Cassandra">
    </div>

    <div class="object apollo">
      <img src="./apollo.png" alt="Apollo">
    </div>

    <div class="object hermes">
      <img src="./hermes.png" alt="Hermes">
    </div>

  </main>


  <!-- МОДАЛЬНОЕ ОКНО -->

  <div class="modal" id="modal">

    <div class="video-box">

      <button
        class="close"
        id="close"
        type="button"
        aria-label="Закрыть"
      >
        ×
      </button>

      <iframe
        id="video"
        src=""
        title="Видео-поздравление"
        allow="autoplay; encrypted-media; picture-in-picture"
        allowfullscreen>
      </iframe>

      <div id="message"></div>

    </div>

  </div>


  <script>

    const objects =
      document.querySelectorAll("[data-video], [data-message]");

    const modal =
      document.getElementById("modal");

    const video =
      document.getElementById("video");

    const message =
      document.getElementById("message");

    const closeButton =
      document.getElementById("close");


    objects.forEach(object => {

      object.addEventListener("click", function () {

        const videoURL =
          object.dataset.video;

        const messageText =
          object.dataset.message;


        if (videoURL) {

          message.style.display = "none";
          message.textContent = "";

          video.style.display = "block";
          video.src = videoURL + "?autoplay=1";

          modal.classList.add("active");
        }


        if (messageText) {

          video.src = "";
          video.style.display = "none";

         message.textContent = messageText;
message.style.display = "flex";

          modal.classList.add("active");
        }

      });

    });


    function closeModal() {

      modal.classList.remove("active");

      video.src = "";
      video.style.display = "block";

      message.textContent = "";
      message.style.display = "none";

    }


    closeButton.addEventListener(
      "click",
      closeModal
    );


    modal.addEventListener("click", function (event) {

      if (event.target === modal) {
        closeModal();
      }

    });


    document.addEventListener("keydown", function (event) {

      if (event.key === "Escape") {
        closeModal();
      }

    });

  </script>

</body>
</html>
