<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Поздравление</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f6f1e8;
    }

    .scene {
      position: relative;
      width: 100%;
      min-height: 100vh;
      overflow: hidden;
    }

    .title {
      position: absolute;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 2;
      width: 90%;
    }

    .title h1 {
      margin: 0;
      font-size: 42px;
    }

    .title p {
      margin-top: 10px;
      font-size: 18px;
    }

    .object {
      position: absolute;
      cursor: pointer;
      transition:
        transform 0.25s ease,
        filter 0.25s ease;
    }

    .object:hover {
      transform: scale(1.08) rotate(2deg);
      filter: drop-shadow(0 10px 15px rgba(0,0,0,.15));
    }

    .object img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Положение предметов */

    .gift {
      width: 180px;
      left: 12%;
      top: 35%;
    }

    .cake {
      width: 220px;
      left: 40%;
      top: 55%;
    }

    .cat {
      width: 190px;
      right: 10%;
      top: 30%;
    }

    .flower {
      width: 150px;
      left: 28%;
      top: 20%;
    }

    /* Затемнение при открытии видео */

    .modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 30px;
      background: rgba(0, 0, 0, 0.8);
      z-index: 100;
    }

    .modal.active {
      display: flex;
    }

    .video-box {
      position: relative;
      width: min(900px, 90vw);
      aspect-ratio: 16 / 9;
      background: #000;
    }

    .video-box iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .close {
      position: absolute;
      right: 0;
      top: -50px;
      border: 0;
      background: none;
      color: white;
      font-size: 42px;
      cursor: pointer;
    }

    @media (max-width: 700px) {

      .title h1 {
        font-size: 30px;
      }

      .gift {
        width: 120px;
        left: 5%;
        top: 40%;
      }

      .cake {
        width: 150px;
        left: 35%;
        top: 65%;
      }

      .cat {
        width: 140px;
        right: 5%;
        top: 35%;
      }

      .flower {
        width: 100px;
        left: 30%;
        top: 23%;
      }
    }

  </style>
</head>

<body>

  <div class="scene">

    <div class="title">
      <h1>С днём рождения!</h1>
      <p>Нажимай на предметы</p>
    </div>


    <!-- ПОДАРОК -->

    <div class="object gift">
      <img src="gift.png" alt="Подарок">
    </div>


    <!-- ТОРТ -->

  <div
  class="object cake"
  data-video="https://www.youtube.com/embed/-u7ORL7_RSg"
>
  <img src="cake.png" alt="Торт">
</div>


    <!-- КОТ — КЛИКАБЕЛЬНЫЙ -->

    <div
      class="object cat"
      data-video="https://www.youtube.com/embed/n92WoYu_kIg"
    >
      <img src="cat.png" alt="Кот">
    </div>


    <!-- ЦВЕТОК -->

    <div class="object flower">
      <img src="flower.png" alt="Цветок">
    </div>

  </div>


  <!-- ОКНО С ВИДЕО -->

  <div class="modal" id="modal">

    <div class="video-box">

      <button class="close" id="close" aria-label="Закрыть">
        ×
      </button>

      <iframe
        id="video"
        src=""
        title="Видео-поздравление"
        allow="autoplay; encrypted-media; picture-in-picture"
        allowfullscreen>
      </iframe>

    </div>

  </div>


  <script>

    const clickableObjects =
      document.querySelectorAll('[data-video]');

    const modal =
      document.getElementById('modal');

    const video =
      document.getElementById('video');

    const closeButton =
      document.getElementById('close');


    clickableObjects.forEach(object => {

      object.addEventListener('click', () => {

        const videoURL =
          object.dataset.video;

        video.src =
          videoURL + '?autoplay=1';

        modal.classList.add('active');

      });

    });


    function closeVideo() {

      modal.classList.remove('active');

      video.src = '';

    }


    closeButton.addEventListener(
      'click',
      closeVideo
    );


    modal.addEventListener('click', event => {

      if (event.target === modal) {
        closeVideo();
      }

    });


    document.addEventListener('keydown', event => {

      if (event.key === 'Escape') {
        closeVideo();
      }

    });

  </script>

</body>
</html>
