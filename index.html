      font-family: "Satyr SP";
      src: url("./SatyrSP.otf") format("opentype");

    @font-face {
      font-family: "UbuntuLI";
      src: url("./Ubuntu-LI.ttf") format("truetype");
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      background: #F1CEB2;
      font-family: Arial, sans-serif;
      cursor: url("./cursor1.png") 16 16, auto;
    }

    .scene {
      position: relative;
      width: 100%;
      min-height: 1600px;
      padding-top: 180px;
      overflow: hidden;
    }

    .title {
      position: absolute;
      top: 35px;
      left: 50%;
      width: 92%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 50;
    }

    .title h1 {
      margin: 0;
      font-family: "Satyr SP", serif;
      font-size: 72px;
      font-weight: normal;
      line-height: 1;
    }

    .title p {
      margin: 10px 0 0;
      font-family: "UbuntuLI", sans-serif;
      font-size: 14px;
      line-height: 1.35;
    }

    .object {
      position: absolute;
      z-index: 10;
      animation: float var(--dur, 4s) ease-in-out infinite;
    }

    .object img,
    .greeting img {
      display: block;
      width: 100%;
      height: auto;
      transition:
        transform 0.25s ease,
        filter 0.25s ease;
    }

    .object img {
      transform: rotate(var(--rot, 0deg));
    }

    .object[data-video],
    .object[data-file],
    .greeting[data-video],
    .greeting[data-file],
    .greeting[data-photo],
    .greeting[data-message] {
      cursor: pointer;
    }

    .object:hover {
      z-index: 20;
    }

    .object:hover img {
      transform:
        rotate(var(--rot, 0deg))
        scale(1.12);

      filter:
        drop-shadow(
          0 18px 24px rgba(0, 0, 0, 0.25)
        );
    }

    @keyframes float {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-12px);
      }
    }

    .greeting {
      position: absolute;
      z-index: 30;
      animation:
        greeting-float
        4s
        ease-in-out
        infinite;
    }

    .greeting:hover {
      z-index: 40;
    }

    .greeting:hover img {
      animation: wiggle 0.6s ease-in-out 1;

      filter:
        drop-shadow(
          0 8px 10px rgba(0, 0, 0, 0.2)
        );
    }

    @keyframes greeting-float {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-6px);
      }
    }

    @keyframes wiggle {
      0% {
        transform: rotate(0) scale(1);
      }

      20% {
        transform: rotate(-14deg) scale(1.12);
      }

      40% {
        transform: rotate(12deg) scale(1.12);
      }

      60% {
        transform: rotate(-9deg) scale(1.12);
      }

      80% {
        transform: rotate(6deg) scale(1.08);
      }

      100% {
        transform: rotate(0) scale(1);
      }
    }

    /* =========================
       EOS MODE
    ========================= */

    .eos-toggle {
      display: flex;
      justify-content: center;
      width: 100%;
      padding: 4px 20px 24px;
      background: #F1CEB2;
      font-family: "Satyr SP", serif;
      font-size: 24px;
      line-height: 1.2;
    }

    .eos-toggle label {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .eos-toggle input {
      width: 20px;
      height: 20px;
      accent-color: #b85f2d;
      cursor: pointer;
    }

    body.eos-mode .greeting {
      z-index: 45;
    }

    body.eos-mode .greeting img {
      animation:
        eos-glow
        2.1s
        ease-in-out
        infinite;
    }

    @keyframes eos-glow {
      0%,
      100% {
        filter:
          drop-shadow(
            0 0 4px rgba(184, 95, 45, 0.5)
          )
          drop-shadow(
            0 0 9px rgba(184, 95, 45, 0.35)
          );
      }

      50% {
        filter:
          drop-shadow(
            0 0 8px rgba(184, 95, 45, 1)
          )
          drop-shadow(
            0 0 18px rgba(184, 95, 45, 0.85)
          )
          drop-shadow(
            0 0 30px rgba(184, 95, 45, 0.55)
          );
      }
    }

    /* =========================
       MODAL
    ========================= */

    .modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.84);
      z-index: 1000;
    }

    .modal.active {
      display: flex;
    }

    .video-box {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: min(900px, 92vw);
      aspect-ratio: 16 / 9;
      background: #1f1b18;
    }

    .video-box iframe,
    .video-box video {
      display: none;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .video-box video {
      object-fit: contain;
      background: #1f1b18;
    }

    /* CIRCLE */

    .video-box.circle {
      width: min(520px, 82vw);
      aspect-ratio: 1;
      background: transparent;
    }

    .video-box.circle iframe,
    .video-box.circle video {
      border: 8px solid #b85f2d;
      border-radius: 50%;
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.35);
    }

    .video-box.circle video {
      object-fit: cover;
    }

    /* VERTICAL */

    .video-box.vertical {
      width: min(420px, 82vw, 45dvh);
      aspect-ratio: 9 / 16;
      padding: 14px;
      background: #1f1b18;
      border: 8px solid #b85f2d;
      border-radius: 24px;
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.35);
    }

    .video-box.vertical iframe,
    .video-box.vertical video {
      width: 100%;
      height: 100%;
      border-radius: 12px;
      object-fit: cover;
    }

    .video-box.vertical .close {
      top: 8px;
      right: 10px;

      width: 42px;
      height: 42px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 0;

      border-radius: 50%;

      background: rgba(31, 27, 24, 0.75);
      color: #F1CEB2;

      font-size: 34px;
      line-height: 1;

      z-index: 50;
    }

    /* HORIZONTAL */

    .video-box.horizontal-frame {
      width: min(900px, 92vw);
      aspect-ratio: 16 / 9;
      padding: 14px;
      background: #1f1b18;
      border: 8px solid #b85f2d;
      border-radius: 24px;
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.35);
    }

    .video-box.horizontal-frame iframe,
    .video-box.horizontal-frame video {
      border-radius: 12px;
    }

    /* ROUND + TEXT */

    .video-box.ring-circle {
      width: min(520px, 70vw);
      aspect-ratio: 1;
      background: transparent;
      border-radius: 50%;
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.35);
    }

    .video-box.ring-circle video {
      position: relative;
      z-index: 10;
      border: 8px solid #b85f2d;
      border-radius: 50%;
      object-fit: cover;
    }

    #ringTextSvg {
      position: absolute;
      display: none;
      left: 50%;
      top: 50%;
      width: calc(100% + 150px);
      height: calc(100% + 150px);
      transform: translate(-50%, -50%);
      overflow: visible;
      pointer-events: none;
      z-index: 5;
    }

    #ringTextSvg text {
      font-family: "Satyr SP", serif;
      font-size: 30px;
      letter-spacing: 2px;
      fill: #F1CEB2;
    }

    .video-box.ring-circle #ringTextSvg {
      display: block;
    }

    /* PHOTO */

    .video-box.photo-mode {
      width: auto;
      max-width: 92vw;
      height: auto;
      aspect-ratio: auto;
      background: transparent;
    }

    #photoCard {
      position: relative;
      display: none;
      width: min(700px, 88vw);
      max-height: 82vh;
      overflow: hidden;
      background: #1f1b18;
      border: 8px solid #b85f2d;
      border-radius: 20px;
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.35);
    }

    #photoImage {
      display: block;
      width: 100%;
      max-height: 82vh;
      object-fit: contain;
      background: #1f1b18;
    }

    #photoCaption {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 45px 18px 16px;
      font-family: "Satyr SP", serif;
      font-size: 20px;
      line-height: 1.25;
      text-align: center;
      color: #F1CEB2;
      background:
        linear-gradient(
          to top,
          rgba(31, 27, 24, 0.92) 0%,
          rgba(31, 27, 24, 0.55) 45%,
          rgba(31, 27, 24, 0) 100%
        );
    }

    /* MESSAGE */

    #message {
      display: none;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      padding: 50px;
      background: #1f1b18;
      border: 6px solid #b85f2d;
      color: #c96b32;
      font-family: "Satyr SP", serif;
      font-size: 42px;
      line-height: 1.25;
      text-align: center;
    }

    /* CLOSE */

    .close {
      position: absolute;
      top: -50px;
      right: 0;
      border: 0;
      background: transparent;
      color: #c96b32;
      font-size: 42px;
      line-height: 1;
      cursor: pointer;
      z-index: 50;
    }

    .video-box.circle .close {
      top: -35px;
      right: 25px;
    }

    .video-box.ring-circle .close {
      top: -60px;
      right: 0;
    }

  <!-- MODAL -->

  <div class="modal" id="modal">

    <div class="video-box">

      <button
        class="close"
        id="close"
        type="button"
        aria-label="Закрыть"
      >
        ×
      </button>


      <svg
        id="ringTextSvg"
        viewBox="0 0 1000 1000"
        aria-hidden="true"
      >

        <defs>
          <path
            id="ringTextPathShape"
            d="
              M 100,500
              A 400,400 0 1,1 900,500
              A 400,400 0 1,1 100,500
            "
          />
        </defs>

        <text>
          <textPath
            id="ringTextPath"
            href="#ringTextPathShape"
            startOffset="8%"
          ></textPath>
        </text>

      </svg>


      <video
        id="localVideo"
        controls
        playsinline
      ></video>


      <iframe
        id="video"
        src=""
        title="Видео-поздравление"
        allow="autoplay; encrypted-media; picture-in-picture"
        allowfullscreen
      ></iframe>


      <div id="photoCard">
        <img id="photoImage" src="" alt="">
        <div id="photoCaption"></div>
      </div>


      <div id="message"></div>

    </div>

  </div>


  <script>
    const clickableObjects = document.querySelectorAll(
      "[data-video], [data-file], [data-message], [data-photo]"
    );

    const modal = document.getElementById("modal");
    const videoBox = document.querySelector(".video-box");

    const youtubeVideo = document.getElementById("video");
    const localVideo = document.getElementById("localVideo");

    const photoCard = document.getElementById("photoCard");
    const photoImage = document.getElementById("photoImage");
    const photoCaption = document.getElementById("photoCaption");

    const message = document.getElementById("message");
    const ringTextPath = document.getElementById("ringTextPath");

    const closeButton = document.getElementById("close");
    const eosMode = document.getElementById("eosMode");

    const modalClasses = [
      "circle",
      "vertical",
      "horizontal-frame",
      "ring-circle",
      "photo-mode"
    ];

    function resetModal() {
      youtubeVideo.src = "";
      youtubeVideo.style.display = "none";

      localVideo.pause();
      localVideo.removeAttribute("src");
      localVideo.load();
      localVideo.style.display = "none";

      photoCard.style.display = "none";
      photoImage.src = "";
      photoCaption.textContent = "";

      message.style.display = "none";
      message.textContent = "";

      ringTextPath.textContent = "";

      videoBox.classList.remove(...modalClasses);
    }

    function applyFormat(shape, format) {
      if (shape === "circle") {
        videoBox.classList.add("circle");
      }

      if (format) {
        videoBox.classList.add(format);
      }
    }

    function showModal() {
      modal.classList.add("active");
    }

    function closeModal() {
      modal.classList.remove("active");
      resetModal();
    }

    function openObject(object) {
      const {
        video: videoURL,
        file: videoFile,
        message: messageText,
        shape,
        format,
        ringText,
        photo,
        caption
      } = object.dataset;

      resetModal();

      if (photo) {
        videoBox.classList.add("photo-mode");

        photoImage.src = photo;
        photoCaption.textContent = caption || "";

        photoCard.style.display = "block";

        showModal();
        return;
      }

      if (videoFile) {
        applyFormat(shape, format);

        ringTextPath.textContent = ringText || "";

        localVideo.src = videoFile;
        localVideo.style.display = "block";

        showModal();

        localVideo.play().catch(() => {});

        return;
      }

      if (videoURL) {
        applyFormat(shape, format);

        youtubeVideo.style.display = "block";

        const separator =
          videoURL.includes("?")
            ? "&"
            : "?";

        youtubeVideo.src =
          `${videoURL}${separator}autoplay=1`;

        showModal();
        return;
      }

      if (messageText) {
        message.textContent = messageText;
        message.style.display = "flex";

        showModal();
      }
    }

    clickableObjects.forEach(object => {
      object.addEventListener(
        "click",
        () => openObject(object)
      );
    });

    closeButton.addEventListener(
      "click",
      closeModal
    );

    modal.addEventListener(
      "click",
      event => {
        if (event.target === modal) {
          closeModal();
        }
      }
    );

    document.addEventListener(
      "keydown",
      event => {
        if (event.key === "Escape") {
          closeModal();
        }
      }
    );

    eosMode.addEventListener(
      "change",
      () => {
        document.body.classList.toggle(
          "eos-mode",
          eosMode.checked
        );
      }
    );
  </script>
