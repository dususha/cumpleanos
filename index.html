<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Поздравление</title>

  <style>

    @font-face {
      font-family: "Satyr SP";
      src: url("./SatyrSP.otf") format("opentype");
      font-weight: normal;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f5b8ce;
    }

    .scene {
      position: relative;
      width: 100%;
      min-height: 100vh;
      overflow: hidden;
    }

    .title {
      position: absolute;
      top: 35px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      text-align: center;
      z-index: 20;
    }

    .title h1 {
      margin: 0;
      font-family: "Satyr SP", serif;
      font-size: 72px;
      font-weight: normal;
      line-height: 1;
    }

    .title p {
      margin: 10px 0 0;
      font-family: "Satyr SP", serif;
      font-size: 26px;
      font-weight: normal;
    }

    .object {
      position: absolute;
      cursor: pointer;
    }

    .object img {
      display: block;
      width: 100%;
      height: auto;
      transition:
        transform 0.25s ease,
        filter 0.25s ease;
    }

    .object:hover img {
      filter: drop-shadow(0 12px 16px rgba(0, 0, 0, 0.18));
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-14px);
      }
    }

    /* ПОДАРОК */

    .gift {
      width: 250px;
      left: 6%;
      top: 43%;
      z-index: 2;
      animation: float 3.8s ease-in-out infinite;
    }

    .gift img {
      transform: rotate(-12deg);
    }

    .gift:hover img {
      transform: rotate(-12deg) scale(1.08);
    }


    /* ТОРТ */

    .cake {
      width: 310px;
      left: 23%;
      top: 38%;
      z-index: 6;
      animation: float 4.3s ease-in-out infinite;
    }

    .cake img {
      transform: rotate(7deg);
    }

    .cake:hover img {
      transform: rotate(7deg) scale(1.08);
    }


    /* КОТ */

    .cat {
      width: 280px;
      left: 49%;
      top: 29%;
      z-index: 5;
      animation: float 3.3s ease-in-out infinite;
    }

    .cat img {
      transform: rotate(-6deg);
    }

    .cat:hover img {
      transform: rotate(-6deg) scale(1.08);
    }


    /* ЦВЕТОК */

    .flower {
      width: 230px;
      left: 68%;
      top: 45%;
      z-index: 7;
      animation: float 4.9s ease-in-out infinite;
    }

    .flower img {
      transform: rotate(11deg);
    }

    .flower:hover img {
      transform: rotate(11deg) scale(1.08);
    }


    /* ОКНО С ВИДЕО */

    .modal {
      position: fixed;
      inset: 0;

      display: none;
      align-items: center;
      justify-content: center;

      padding: 30px;

      background: rgba(0, 0, 0, 0.84);

      z-index: 1000;
    }

    .modal.active {
      display: flex;
    }

    .video-box {
      position: relative;
      width: min(900px, 92vw);
      aspect-ratio: 16 / 9;
      background: #000;
    }

    .video-box iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .close {
      position: absolute;
      top: -50px;
      right: 0;

      border: 0;
      background: transparent;

      color: white;
      font-size: 42px;
      line-height: 1;

      cursor: pointer;
    }


    /* МОБИЛЬНАЯ ВЕРСИЯ */

    @media (max-width: 700px) {

      .title {
        top: 25px;
      }

      .title h1 {
        font-size: 48px;
      }

      .title p {
        font-size: 21px;
      }

      .gift {
        width: 150px;
        left: -3%;
        top: 42%;
      }

      .cake {
        width: 190px;
        left: 18%;
        top: 52%;
      }

      .cat {
        width: 175px;
        left: 51%;
        top: 30%;
      }

      .flower {
        width: 135px;
        left: 67%;
        top: 58%;
      }
    }

  </style>
</head>

<body>

  <main class="scene">

    <div class="title">
      <h1>С днём рождения!</h1>
      <p>Добрые речи друзей здесь Светлане Светлоликой с любовью собраны</p>
    </div>


    <!-- ПОДАРОК -->

    <div class="object gift">
      <img src="./gift.png" alt="Подарок">
    </div>


    <!-- ТОРТ -->

    <div
      class="object cake"
      data-video="https://www.youtube.com/embed/-u7ORL7_RSg"
    >
      <img src="./cake.png" alt="Торт">
    </div>


    <!-- КОТ -->

    <div
      class="object cat"
      data-video="https://www.youtube.com/embed/n92WoYu_kIg"
    >
      <img src="./cat.png" alt="Кот">
    </div>


    <!-- ЦВЕТОК -->

    <div class="object flower">
      <img src="./flower.png" alt="Цветок">
    </div>

  </main>


  <!-- МОДАЛЬНОЕ ОКНО -->

  <div class="modal" id="modal">

    <div class="video-box">

      <button
        class="close"
        id="close"
        type="button"
        aria-label="Закрыть"
      >
        ×
      </button>

      <iframe
        id="video"
        src=""
        title="Видео-поздравление"
        allow="autoplay; encrypted-media; picture-in-picture"
        allowfullscreen>
      </iframe>

    </div>

  </div>


  <script>

    const objects =
      document.querySelectorAll("[data-video]");

    const modal =
      document.getElementById("modal");

    const video =
      document.getElementById("video");

    const closeButton =
      document.getElementById("close");


    objects.forEach(object => {

      object.addEventListener("click", function () {

        const videoURL =
          object.dataset.video;

        video.src =
          videoURL + "?autoplay=1";

        modal.classList.add("active");

      });

    });


    function closeVideo() {

      modal.classList.remove("active");

      video.src = "";

    }


    closeButton.addEventListener(
      "click",
      closeVideo
    );


    modal.addEventListener("click", function (event) {

      if (event.target === modal) {
        closeVideo();
      }

    });


    document.addEventListener("keydown", function (event) {

      if (event.key === "Escape") {
        closeVideo();
      }

    });

  </script>

</body>
</html>
