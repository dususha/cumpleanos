<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Светлоликая Светлана</title>

  <style>

    /* =========================
       ШРИФТЫ
    ========================= */

    @font-face {
      font-family: "Satyr SP";
      src: url("./SatyrSP.otf") format("opentype");
      font-weight: normal;
      font-style: normal;
    }

    @font-face {
      font-family: "UbuntuLI";
      src: url("./Ubuntu-LI.ttf") format("truetype");
      font-weight: normal;
      font-style: normal;
    }


    /* =========================
       ОБЩИЕ НАСТРОЙКИ
    ========================= */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f3eee4;
      cursor: url("./cursor1.png") 16 16, auto;
    }


    /* =========================
       СЦЕНА
    ========================= */

    .scene {
      position: relative;
      width: 100%;
      min-height: 1420px;
      overflow: hidden;
      padding-top: 180px;
    }


    /* =========================
       ЗАГОЛОВОК
    ========================= */

    .title {
      position: absolute;
      top: 35px;
      left: 50%;
      transform: translateX(-50%);
      width: 92%;
      text-align: center;
      z-index: 50;
    }

    .title h1 {
      margin: 0;
      font-family: "Satyr SP", serif;
      font-size: 72px;
      font-weight: normal;
      line-height: 1;
    }

    .title p {
      margin: 10px 0 0;
      font-family: "UbuntuLI", serif;
      font-size: 14px;
      font-weight: normal;
    }


    /* =========================
       ОСНОВНЫЕ КАРТИНКИ
    ========================= */

    .object {
      position: absolute;
      z-index: 10;

      animation:
        float var(--dur, 4s)
        ease-in-out
        infinite;
    }

    .object[data-video] {
      cursor: pointer;
    }

    .object img {
      display: block;
      width: 100%;
      height: auto;

      transform: rotate(var(--rot, 0deg));

      transition:
        transform 0.25s ease,
        filter 0.25s ease;
    }

    .object:hover {
      z-index: 20;
    }

    .object:hover img {
      transform:
        rotate(var(--rot, 0deg))
        scale(1.12);

      filter:
        drop-shadow(
          0 18px 24px
          rgba(0, 0, 0, 0.25)
        );
    }


    @keyframes float {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-12px);
      }
    }


    /* =========================
       ПАСХАЛКИ
    ========================= */

    .greeting {
      position: absolute;
      z-index: 30;
      cursor: pointer;

      animation:
        greeting-float
        4s
        ease-in-out
        infinite;
    }

    .greeting img {
      display: block;
      width: 100%;
      height: auto;

      transition:
        transform 0.25s ease,
        filter 0.25s ease;
    }

    .greeting:hover {
      z-index: 40;
    }

    .greeting:hover img {
      animation:
        wiggle
        0.6s
        ease-in-out
        1;

      filter:
        drop-shadow(
          0 8px 10px
          rgba(0, 0, 0, 0.2)
        );
    }


    @keyframes wiggle {

      0% {
        transform: rotate(0deg) scale(1);
      }

      20% {
        transform: rotate(-14deg) scale(1.12);
      }

      40% {
        transform: rotate(12deg) scale(1.12);
      }

      60% {
        transform: rotate(-9deg) scale(1.12);
      }

      80% {
        transform: rotate(6deg) scale(1.08);
      }

      100% {
        transform: rotate(0deg) scale(1);
      }

    }


    @keyframes greeting-float {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-6px);
      }

    }

       DESKTOP — РАСКИДАННЫЙ КОЛЛАЖ

    /* =========================
       МОДАЛЬНОЕ ОКНО
    ========================= */

    .modal {
      position: fixed;
      inset: 0;

      display: none;

      align-items: center;
      justify-content: center;

      padding: 30px;

      background: rgba(0, 0, 0, 0.84);

      z-index: 1000;
    }

    .modal.active {
      display: flex;
    }


    .video-box {
      position: relative;

      width: min(900px, 92vw);

      aspect-ratio: 16 / 9;

      background: #1f1b18;

      display: flex;
      align-items: center;
      justify-content: center;
    }


    .video-box iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }


    #message {
      display: none;

      width: 100%;
      height: 100%;

      background: #1f1b18;
      color: #c96b32;

      font-family:
        "Satyr SP",
        serif;

      font-size: 42px;
      line-height: 1.25;
      text-align: center;

      padding: 50px;

      align-items: center;
      justify-content: center;

      border: 6px solid #b85f2d;
    }


    .close {
      position: absolute;
      top: -50px;
      right: 0;

      border: 0;
      background: transparent;

      color: #c96b32;

      font-size: 42px;
      line-height: 1;

      cursor: pointer;
    }

  </style>
</head>



<body>


  <main class="scene">


    <!-- ЗАГОЛОВОК -->

    <div class="title">

      <h1>
        С днём рождения!

      <p>
        Добрые речи подруг и друзей здесь Светлане Светлоликой с любовью собраны
      </p>

    </div>



    <!-- ПРИВЕТЫ С ОЛИМПА -->

    <div
      class="greeting luck"
      data-message="🍀 О, да сопутствует случай тебе благосклонный"
    >
      <img src="./luck.png" alt="Luck">
    </div>


    <div
      class="greeting love"
      data-message="💘 Да умножит Киприда любовь и веселье"

    </div>


    <div
      class="greeting rest"
      data-message="🌙 Сладостен сон; почивай же без всякой тревоги"
    >

    </div>


    <div
      class="greeting joy"
      data-message="✨ Смех да пребудет с тобой, и пиры, и отрада"
    >

    </div>


    <div
      class="greeting adventure"
      data-message="🏺 Странствуй отважно, но мимо циклопов по возможности"
    >
      <img src="./adventure.png" alt="Adventure">
    </div>



    <!-- ОСНОВНЫЕ КАРТИНКИ -->


    <div
      class="object eos"
      data-video="https://www.youtube.com/embed/n92WoYu_kIg"
    >
      <img src="./eos.png" alt="Eos">
    </div>


    <div
      class="object themis"
      data-video="https://www.youtube.com/embed/sWfOfMFYXu8"
    >
      <img src="./themis.png" alt="Themis">
    </div>


    <div class="object artemis">
      <img src="./artemis.png" alt="Artemis">
    </div>


    <div class="object hera">
      <img src="./hera.png" alt="Hera">
    </div>


    <div class="object demeter">
      <img src="./demeter.png" alt="Demeter">
    </div>


    <div class="object persephone">
      <img src="./persephone.png" alt="Persephone">
    </div>


    <div

      data-video="https://www.youtube.com/embed/rIFX2fCCWto"
    >

    </div>


    <div class="object selene">
      <img src="./selene.png" alt="Selene">
    </div>


    <div class="object hecate">
      <img src="./hecate.png" alt="Hecate">
    </div>


 <div

  data-video="https://www.youtube.com/embed/xKC3ytckkYk"
>
  <img src="./nike.png" alt="Nike">
</div>


    <div
      class="object iris"
      data-video="https://www.youtube.com/embed/M5i-03CmOzc"
    >

    </div>


   <div

>

    <div class="object calypso">
      <img src="./calypso.png" alt="Calypso">
    </div>


    <div class="object cassandra">
      <img src="./cassandra.png" alt="Cassandra">
    </div>


    <div class="object apollo">
      <img src="./apollo.png" alt="Apollo">
    </div>

      <img src="./hermes.png" alt="Hermes">
    </div>


  </main>



  <!-- МОДАЛЬНОЕ ОКНО -->

  <div class="modal" id="modal">

    <div class="video-box">

      <button
        class="close"
        id="close"
        type="button"
        aria-label="Закрыть"
      >
        ×
      </button>


      <iframe
        id="video"
        src=""
        title="Видео-поздравление"
        allow="autoplay; encrypted-media; picture-in-picture"
        allowfullscreen>
      </iframe>


      <div id="message"></div>

    </div>

  </div>



  <script>

    const objects =
      document.querySelectorAll(
        "[data-video], [data-message]"
      );

    const modal =
      document.getElementById("modal");

    const video =
      document.getElementById("video");

    const message =
      document.getElementById("message");

    const closeButton =
      document.getElementById("close");


    objects.forEach(object => {

      object.addEventListener(
        "click",
        function () {

          const videoURL =
            object.dataset.video;

          const messageText =
            object.dataset.message;


          if (videoURL) {

            message.style.display =
              "none";

            message.textContent =
              "";

            video.style.display =
              "block";

            video.src =
              videoURL +
              "?autoplay=1";

            modal.classList.add(
              "active"
            );

          }


          if (messageText) {

            video.src =
              "";

            video.style.display =
              "none";

            message.textContent =
              messageText;

            message.style.display =
              "flex";

            modal.classList.add(
              "active"
            );

          }

        }
      );

    });


    function closeModal() {

      modal.classList.remove(
        "active"
      );

      video.src =
        "";

      video.style.display =
        "block";

      message.textContent =
        "";

      message.style.display =
        "none";

    }


    closeButton.addEventListener(
      "click",
      closeModal
    );


    modal.addEventListener(
      "click",
      function (event) {

        if (event.target === modal) {
          closeModal();
        }

      }
    );


    document.addEventListener(
      "keydown",
      function (event) {

        if (event.key === "Escape") {
          closeModal();
        }

      }
    );

  </script>
