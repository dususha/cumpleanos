<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Светлоликая Светлана</title>

  <style>

    @font-face {
      font-family: "Satyr SP";
      src: url("./SatyrSP.otf") format("opentype");
      font-weight: normal;
      font-style: normal;
    }

    @font-face {
      font-family: "UbuntuLI";
      src: url("./Ubuntu-LI.ttf") format("truetype");
      font-weight: normal;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f3eee4;
    }

    .scene {
      position: relative;
      width: 100%;
      min-height: 1750px;
      overflow: hidden;
      padding-top: 180px;
    }

    .title {
      position: absolute;
      top: 35px;
      left: 50%;
      transform: translateX(-50%);
      width: 92%;
      text-align: center;
      z-index: 50;
    }

    .title h1 {
      margin: 0;
      font-family: "Satyr SP", serif;
      font-size: 72px;
      font-weight: normal;
      line-height: 1;
    }

    .title p {
      margin: 10px 0 0;
      font-family: "UbuntuLI", serif;
      font-size: 14px;
      font-weight: normal;
    }

    .object {
      position: absolute;
      z-index: 1;
      animation: float var(--dur, 4s) ease-in-out infinite;
    }

    .object[data-video] {
      cursor: pointer;
    }

    .object img {
      display: block;
      width: 100%;
      height: auto;
      transform: rotate(var(--rot, 0deg));
      transition:
        transform 0.25s ease,
        filter 0.25s ease;
    }

   .object:hover {
  z-index: 999;
}

.object:hover img {
  transform: rotate(var(--rot, 0deg)) scale(1.15);
  filter: drop-shadow(0 18px 24px rgba(0, 0, 0, 0.25));
}
.decor {
  position: absolute;
  pointer-events: none;
}

.decor img {
  display: block;
  width: 100%;
  height: auto;
}

/* Огромная картинка слева, частично за экраном */
.decor-one {
  width: 650px;
  left: -180px;
  top: 220px;
  z-index: 0;
  transform: rotate(-18deg);
}

/* Огромная картинка справа */
.decor-two {
  width: 700px;
  right: -220px;
  top: 600px;
  z-index: 1;
  transform: rotate(14deg);
}
    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-14px);
      }
    }

    /* 16 КАРТИНОК */

    .eos {

      z-index: 4;
      --rot: -8deg;
      --dur: 3.7s;
    }

    .themis {

      left: 17%;
      top: 340px;
      z-index: 8;
      --rot: 7deg;
      --dur: 4.3s;
    }

    .artemis {

      --rot: -5deg;

    }

    .hera {
      width: 210px;

    .demeter {

    .persephone {

    .hestia {

    .selene {

    }

    .nike {

      z-index: 12;

      --dur: 3.5s;
    }

    .iris {
      width: 230px;

    }

    .circe {

    }

    .calypso {

    }

    .cassandra {

    }

    .apollo {

    }

    .hermes {

      --dur: 3.8s;
    }

    /* ОКНО С ВИДЕО */

    .modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 30px;
      background: rgba(0, 0, 0, 0.84);
      z-index: 1000;
    }

    .modal.active {
      display: flex;
    }

    .video-box {
      position: relative;
      width: min(900px, 92vw);
      aspect-ratio: 16 / 9;
      background: #000;
    }

    .video-box iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .close {
      position: absolute;
      top: -50px;
      right: 0;
      border: 0;
      background: transparent;
      color: white;
      font-size: 42px;
      line-height: 1;
      cursor: pointer;
    }

    /* МОБИЛЬНАЯ ВЕРСИЯ */

    @media (max-width: 700px) {

      .scene {
        min-height: 3000px;
        padding-top: 160px;
      }

      .title {

      .hecate {
        width: 150px;

      }

      }

      .iris {

      .circe {

  </style>
</head>

<body>

  <main class="scene">

    <div class="title">
      <h1>С днём рождения!</h1>
      <p>Добрые речи подруг и друзей здесь Светлане Светлоликой с любовью собраны</p>
    </div>
  <!-- ФОН -->
    <div class="decor decor-one">
  <img src="./background1.jpg" alt="">
</div>

<div class="decor decor-two">
  <img src="./background2.jpg" alt="">
</div>
    <div
      class="object eos"
      data-video="https://www.youtube.com/embed/n92WoYu_kIg"
    >
      <img src="./eos.jpg" alt="Eos">
    </div>

    <div
      class="object themis"
      data-video="https://www.youtube.com/embed/-u7ORL7_RSg"
    >
      <img src="./themis.jpg" alt="Themis">
    </div>

    <div class="object artemis">
      <img src="./artemis.jpg" alt="Artemis">
    </div>

    <div class="object hera">
      <img src="./hera.jpg" alt="Hera">
    </div>

    <div class="object demeter">
      <img src="./demeter.jpg" alt="Demeter">
    </div>

    <div class="object persephone">
      <img src="./persephone.jpg" alt="Persephone">
    </div>

    <div class="object hestia">
      <img src="./hestia.jpg" alt="Hestia">
    </div>

    <div class="object selene">
      <img src="./selene.jpg" alt="Selene">
    </div>

    <div class="object hecate">
      <img src="./hecate.jpg" alt="Hecate">
    </div>

    <div class="object nike">
      <img src="./nike.jpg" alt="Nike">
    </div>

    <div class="object iris">
      <img src="./iris.jpg" alt="Iris">
    </div>

    <div class="object circe">
      <img src="./circe.jpg" alt="Circe">
    </div>

    <div class="object calypso">
      <img src="./calypso.jpg" alt="Calypso">
    </div>

    <div class="object cassandra">
      <img src="./cassandra.jpg" alt="Cassandra">
    </div>

    <div class="object apollo">
      <img src="./apollo.jpg" alt="Apollo">
    </div>

    <div class="object hermes">
      <img src="./hermes.jpg" alt="Hermes">
    </div>

  </main>

  <div class="modal" id="modal">
    <div class="video-box">
      <button
        class="close"
        id="close"
        type="button"
        aria-label="Закрыть"
      >
        ×
      </button>

      <iframe
        id="video"
        src=""
        title="Видео-поздравление"
        allow="autoplay; encrypted-media; picture-in-picture"
        allowfullscreen>
      </iframe>
    </div>
  </div>

  <script>

    const objects =
      document.querySelectorAll("[data-video]");

    const modal =
      document.getElementById("modal");

    const video =
      document.getElementById("video");

    const closeButton =
      document.getElementById("close");

    objects.forEach(object => {

      object.addEventListener("click", function () {

        const videoURL =
          object.dataset.video;

        video.src =
          videoURL + "?autoplay=1";

        modal.classList.add("active");

      });

    });

    function closeVideo() {
      modal.classList.remove("active");
      video.src = "";
    }

    closeButton.addEventListener(
      "click",
      closeVideo
    );

    modal.addEventListener("click", function (event) {
      if (event.target === modal) {
        closeVideo();
      }
    });

    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape") {
        closeVideo();
      }
    });

  </script>

</body>
