<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Светлоликая Светлана</title>

  <style>

    /* ==================================================
       ШРИФТЫ
    ================================================== */

    @font-face {
      font-family: "Satyr SP";
      src: url("./SatyrSP.otf") format("opentype");
      font-weight: normal;
      font-style: normal;
    }

    @font-face {
      font-family: "UbuntuLI";
      src: url("./Ubuntu-LI.ttf") format("truetype");
      font-weight: normal;
      font-style: normal;
    }


    /* ==================================================
       ОБЩЕЕ
    ================================================== */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      background: #F1CEB2;
      font-family: Arial, sans-serif;
      cursor: url("./cursor1.png") 16 16, auto;

      overflow-x: hidden;
    }


    /* ==================================================
       СЦЕНА
    ================================================== */

    .scene {
      position: relative;
      width: 100%;
      min-height: 1500px;

      overflow: hidden;

      padding-top: 180px;
    }


    /* ==================================================
       ЗАГОЛОВОК
    ================================================== */

    .title {
      position: absolute;

      top: 35px;
      left: 50%;

      transform: translateX(-50%);

      width: 92%;

      text-align: center;

      z-index: 50;
    }

    .title h1 {
      margin: 0;

      font-family: "Satyr SP", serif;

      font-size: 72px;
      font-weight: normal;

      line-height: 1;
    }

    .title p {
      margin: 10px 0 0;

      font-family: "UbuntuLI", sans-serif;

      font-size: 14px;
      line-height: 1.35;
    }


    /* ==================================================
       ПЕРСОНАЖИ
    ================================================== */

    .object {
      position: absolute;

      z-index: 10;

      animation:
        float
        var(--dur, 4s)
        ease-in-out
        infinite;
    }

    .object[data-video],
    .object[data-file],
    .greeting[data-video],
    .greeting[data-file],
    .greeting[data-message],
    .greeting[data-photo] {
      cursor: pointer;
    }

    .object img,
    .greeting img {
      display: block;

      width: 100%;
      height: auto;

      transition:
        transform 0.25s ease,
        filter 0.25s ease;
    }

    .object img {
      transform:
        rotate(
          var(--rot, 0deg)
        );
    }

    .object:hover {
      z-index: 20;
    }

    .object:hover img {
      transform:
        rotate(
          var(--rot, 0deg)
        )
        scale(1.12);

      filter:
        drop-shadow(
          0 18px 24px
          rgba(0, 0, 0, 0.25)
        );
    }


    @keyframes float {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-12px);
      }

    }


    /* ==================================================
       10 ДАРОВ
    ================================================== */

    .greeting {
      position: absolute;

      z-index: 30;

      animation:
        greeting-float
        4s
        ease-in-out
        infinite;
    }

    .greeting:hover {
      z-index: 40;
    }

    .greeting:hover img {
      animation:
        wiggle
        0.6s
        ease-in-out
        1;

      filter:
        drop-shadow(
          0 8px 10px
          rgba(0, 0, 0, 0.2)
        );
    }


    @keyframes greeting-float {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-6px);
      }

    }


    @keyframes wiggle {

      0% {
        transform:
          rotate(0deg)
          scale(1);
      }

      20% {
        transform:
          rotate(-14deg)
          scale(1.12);
      }

      40% {
        transform:
          rotate(12deg)
          scale(1.12);
      }

      60% {
        transform:
          rotate(-9deg)
          scale(1.12);
      }

      80% {
        transform:
          rotate(6deg)
          scale(1.08);
      }

      100% {
        transform:
          rotate(0deg)
          scale(1);
      }

    }


    /* ==================================================
       DESKTOP
    ================================================== */

    .eos {
      width: 360px;
      left: 2%;
      top: 215px;

      --rot: -7deg;
      --dur: 3.7s;
    }


    .artemis {
      width: 245px;
      left: 22%;
      top: 270px;

      --rot: -4deg;
      --dur: 3.9s;
    }


    .themis {
      width: 350px;
      left: 44%;
      top: 205px;

      --rot: -6deg;
      --dur: 4.6s;
    }


    .demeter {
      width: 350px;
      left: 68%;
      top: 255px;

      --rot: -7deg;
      --dur: 4.1s;
    }


    .hestia {
      width: 350px;
      left: 30%;
      top: 500px;

      --rot: 6deg;
      --dur: 4.3s;
    }


    /* CIRCE +10% */

    .circe {
      width: 297px;
      left: 77%;
      top: 455px;

      --rot: 8deg;
      --dur: 3.9s;
    }


    /* HECATE +10% */

    .hecate {

      left: 4%;
      top: 655px;

      --rot: -8deg;
      --dur: 4.5s;
    }


    .iris {
      width: 270px;
      left: 28%;
      top: 690px;

      --rot: -5deg;
      --dur: 4.7s;
    }


    .apollo {
      width: 285px;
      left: 51%;
      top: 640px;

      --rot: -4deg;
      --dur: 4.2s;
    }


    /* NIKE +10% */

    .nike {

      --rot: 4deg;
      --dur: 3.5s;
    }

       HERMES И SELENE ПОМЕНЯНЫ МЕСТАМИ
    ================================================== */

    .selene {

      --dur: 3.8s;

      left: 28%;
      top: 1080px;

      --rot: 5deg;
      --dur: 3.6s;
    }


    .cassandra {

      left: 77%;
      top: 1110px;

      --rot: 7deg;
      --dur: 3.7s;
    }


    /* ==================================================
       ДАРЫ — DESKTOP
    ================================================== */

    .luck {
      width: 54px;
      left: 39%;
      top: 405px;

      animation-duration: 3.4s;
    }


    .love {
      width: 58px;

    }

    .joy {
      width: 56px;

    }

    .adventure {

      top: 800px;

    }

      width: 54px;
      left: 68%;
      top: 905px;

      animation-duration: 4.5s;
    }


    /* TREASURE — отдельное место */

    .treasure {
      width: 58px;
      left: 87%;
      top: 975px;

      animation-duration: 4.3s;
    }


    /* ==================================================
       РЕЖИМ ЭОС
    ================================================== */

    .eos-toggle {
      width: 100%;

      padding:
        28px
        20px
        52px;

      display: flex;
      justify-content: center;

      background: #F1CEB2;

      font-family:
        "Satyr SP",
        serif;

      font-size: 24px;
      line-height: 1.2;
    }


    .eos-toggle label {
      display: flex;

      align-items: center;
      justify-content: center;

      gap: 12px;

      cursor: pointer;

      text-align: center;
    }


    .eos-toggle input {
      width: 20px;
      height: 20px;

      flex: 0 0 auto;

      accent-color: #b85f2d;

      cursor: pointer;
    }


    /* ==================================================
       МЕРЦАНИЕ В РЕЖИМЕ ЭОС
    ================================================== */

    body.eos-mode .greeting {
      z-index: 45;
    }


    body.eos-mode .greeting img {
      animation:
        eos-glow
        2.1s
        ease-in-out
        infinite;
    }


    @keyframes eos-glow {

      0%,
      100% {

        filter:
          drop-shadow(
            0 0 4px
            rgba(184, 95, 45, 0.5)
          )
          drop-shadow(
            0 0 9px
            rgba(184, 95, 45, 0.35)
          );

      }


      50% {

        filter:
          drop-shadow(
            0 0 8px
            rgba(184, 95, 45, 1)
          )
          drop-shadow(
            0 0 18px
            rgba(184, 95, 45, 0.85)
          )
          drop-shadow(
            0 0 30px
            rgba(184, 95, 45, 0.55)
          );

      }

    }


    /* ==================================================
       МОДАЛЬНОЕ ОКНО
    ================================================== */

    .modal {
      position: fixed;
      inset: 0;

      display: none;

      align-items: center;
      justify-content: center;

      padding: 30px;

      background:
        rgba(
          0,
          0,
          0,
          0.84
        );

      z-index: 1000;
    }


    .modal.active {
      display: flex;
    }


    .video-box {
      position: relative;

      width:
        min(
          900px,
          92vw
        );

      aspect-ratio:
        16 / 9;

      background:
        #1f1b18;

      display: flex;

      align-items: center;
      justify-content: center;
    }


    .video-box iframe {
      display: none;

      width: 100%;
      height: 100%;

      border: 0;
    }


    .video-box video {
      display: none;

      width: 100%;
      height: 100%;

      border: 0;

      object-fit: contain;

      background:
        #1f1b18;
    }


    /* ==================================================
       КРУГЛОЕ ВИДЕО
    ================================================== */

    .video-box.circle {
      width:
        min(
          520px,
          82vw
        );

      aspect-ratio:
        1 / 1;

      background:
        transparent;
    }


    .video-box.circle video,
    .video-box.circle iframe {
      width: 100%;
      height: 100%;

      border-radius: 50%;

      border:
        8px solid
        #b85f2d;

      box-shadow:
        0 20px 60px
        rgba(
          0,
          0,
          0,
          0.35
        );
    }


    .video-box.circle video {
      object-fit: cover;
    }


    /* ==================================================
       ВЕРТИКАЛЬНОЕ
    ================================================== */

    .video-box.vertical {
      width:
        min(
          420px,
          82vw
        );

      aspect-ratio:
        9 / 16;

      padding: 14px;

      background:
        #1f1b18;

      border:
        8px solid
        #b85f2d;

      border-radius:
        24px;

      box-shadow:
        0 20px 60px
        rgba(
          0,
          0,
          0,
          0.35
        );
    }


    .video-box.vertical iframe,
    .video-box.vertical video {
      width: 100%;
      height: 100%;

      border: 0;

      border-radius:
        12px;

      object-fit: cover;
    }


    /* ==================================================
       ГОРИЗОНТАЛЬНОЕ
    ================================================== */

    .video-box.horizontal-frame {
      width:
        min(
          900px,
          92vw
        );

      aspect-ratio:
        16 / 9;

      padding: 14px;

      background:
        #1f1b18;

      border:
        8px solid
        #b85f2d;

      border-radius:
        24px;

      box-shadow:
        0 20px 60px
        rgba(
          0,
          0,
          0,
          0.35
        );
    }


    .video-box.horizontal-frame iframe,
    .video-box.horizontal-frame video {
      width: 100%;
      height: 100%;

      border: 0;

      border-radius:
        12px;
    }


    /* ==================================================
       КРУГЛОЕ + НАДПИСЬ
    ================================================== */

    .video-box.ring-circle {
      width:
        min(
          520px,
          70vw
        );

      aspect-ratio:
        1 / 1;

      padding: 0;

      background:
        transparent;

      border: 0;

      border-radius:
        50%;

      box-shadow:
        0 20px 60px
        rgba(
          0,
          0,
          0,
          0.35
        );
    }


    .video-box.ring-circle video {
      width: 100%;
      height: 100%;

      border-radius:
        50%;

      border:
        8px solid
        #b85f2d;

      object-fit: cover;

      background:
        #1f1b18;

      position: relative;

      z-index: 10;
    }


    #ringTextSvg {
      display: none;

      position: absolute;

      left: 50%;
      top: 50%;

      width:
        calc(
          100% + 150px
        );

      height:
        calc(
          100% + 150px
        );

      transform:
        translate(
          -50%,
          -50%
        );

      overflow: visible;

      pointer-events: none;

      z-index: 5;
    }


    #ringTextSvg text {
      font-family:
        "Satyr SP",
        serif;

      font-size: 30px;

      letter-spacing:
        2px;

      fill:
        #F1CEB2;
    }


    .video-box.ring-circle
    #ringTextSvg {
      display: block;
    }


    .video-box.ring-circle
    .close {
      top: -60px;
      right: 0;

      z-index: 30;
    }


    /* ==================================================
       ФОТО
    ================================================== */

    .video-box.photo-mode {
      width: auto;

      max-width:
        92vw;

      height: auto;

      aspect-ratio:
        auto;

      background:
        transparent;
    }


    #photoCard {
      display: none;

      position: relative;

      width:
        min(
          700px,
          88vw
        );

      max-height:
        82vh;

      background:
        #1f1b18;

      border:
        8px solid
        #b85f2d;

      border-radius:
        20px;

      overflow:
        hidden;

      box-shadow:
        0 20px 60px
        rgba(
          0,
          0,
          0,
          0.35
        );
    }


    #photoImage {
      display: block;

      width: 100%;

      max-height:
        82vh;

      object-fit:
        contain;

      background:
        #1f1b18;
    }


    #photoCaption {
      position: absolute;

      left: 0;
      right: 0;
      bottom: 0;

      padding:
        45px
        18px
        16px;

      font-family:
        "Satyr SP",
        serif;

      font-size:
        20px;

      line-height:
        1.25;

      text-align:
        center;

      color:
        #F1CEB2;

      background:
        linear-gradient(
          to top,
          rgba(31,27,24,.92) 0%,
          rgba(31,27,24,.55) 45%,
          rgba(31,27,24,0) 100%
        );
    }


    /* ==================================================
       ТЕКСТОВЫЕ ПОСЛАНИЯ
    ================================================== */

    #message {
      display: none;

      width: 100%;
      height: 100%;

      background:
        #1f1b18;

      color:
        #c96b32;

      font-family:
        "Satyr SP",
        serif;

      font-size:
        42px;

      line-height:
        1.25;

      text-align:
        center;

      padding:
        50px;

      align-items:
        center;

      justify-content:
        center;

      border:
        6px solid
        #b85f2d;
    }


    /* ==================================================
       ЗАКРЫТИЕ
    ================================================== */

    .close {
      position:
        absolute;

      top:
        -50px;

      right:
        0;

      border:
        0;

      background:
        transparent;

      color:
        #c96b32;

      font-size:
        42px;

      line-height:
        1;

      cursor:
        pointer;

      z-index:
        50;
    }


    .video-box.circle
    .close {
      top:
        -35px;

      right:
        25px;
    }

      <!-- ТЕКСТ ПО ДУГЕ -->

      <svg

        aria-hidden="true"
      >

              M 100,500
              A 400,400 0 1,1 900,500
              A 400,400 0 1,1 100,500
            "
          />

        <text>

            id="ringTextPath"
            href="#ringTextPathShape"
            startOffset="8%"
          ></textPath>

        </text>

      </svg>



      <!-- LOCAL VIDEO -->

        id="localVideo"
        controls
        playsinline

        allow="autoplay; encrypted-media; picture-in-picture"

        id="message"
      ></div>

  <script>


    /* ==================================================
       ЭЛЕМЕНТЫ
    ================================================== */

    const objects =
      document.querySelectorAll(
        "[data-video], [data-file], [data-message], [data-photo]"
      );


    const modal =
      document.getElementById(
        "modal"
      );


    const video =
      document.getElementById(
        "video"
      );


    const localVideo =
      document.getElementById(
        "localVideo"
      );


    const message =
      document.getElementById(
        "message"
      );


    const photoCard =
      document.getElementById(
        "photoCard"
      );


    const photoImage =
      document.getElementById(
        "photoImage"
      );


    const photoCaption =
      document.getElementById(
        "photoCaption"
      );


    const closeButton =
      document.getElementById(
        "close"
      );


    const videoBox =
      document.querySelector(
        ".video-box"
      );


    const ringTextPath =
      document.getElementById(
        "ringTextPath"
      );


    const eosMode =
      document.getElementById(
        "eosMode"
      );



    /* ==================================================
       ОЧИСТКА
    ================================================== */

    function clearContent() {


      /* YouTube */

      video.src =
        "";

      video.style.display =
        "none";


      /* LOCAL VIDEO */

      localVideo.pause();


      localVideo.removeAttribute(
        "src"
      );


      localVideo.load();


      localVideo.style.display =
        "none";


      /* MESSAGE */

      message.textContent =
        "";


      message.style.display =
        "none";


      /* PHOTO */

      photoCard.style.display =
        "none";


      photoImage.src =
        "";


      photoCaption.textContent =
        "";


      /* RING TEXT */

      ringTextPath.textContent =
        "";


      /* CLASSES */

      videoBox.classList.remove(
        "circle",
        "vertical",
        "horizontal-frame",
        "ring-circle",
        "photo-mode"
      );

    }



    /* ==================================================
       ФОРМАТ
    ================================================== */

    function setVideoBoxStyle(
      shape,
      format
    ) {


      videoBox.classList.remove(
        "circle",
        "vertical",
        "horizontal-frame",
        "ring-circle",
        "photo-mode"
      );


      if (
        shape === "circle"
      ) {

        videoBox.classList.add(
          "circle"
        );

      }


      if (
        format === "vertical"
      ) {

        videoBox.classList.add(
          "vertical"
        );

      }


      if (
        format ===
        "horizontal-frame"
      ) {

        videoBox.classList.add(
          "horizontal-frame"
        );

      }


      if (
        format ===
        "ring-circle"
      ) {

        videoBox.classList.add(
          "ring-circle"
        );

      }

    }



    /* ==================================================
       КЛИКИ
    ================================================== */

    objects.forEach(
      object => {


        object.addEventListener(
          "click",
          function () {


            const videoURL =
              object.dataset.video;


            const videoFile =
              object.dataset.file;


            const messageText =
              object.dataset.message;


            const shape =
              object.dataset.shape;


            const format =
              object.dataset.format;


            const ringText =
              object.dataset.ringText;


            const photo =
              object.dataset.photo;


            const caption =
              object.dataset.caption;



            /* =========================
               PHOTO
            ========================= */

            if (
              photo
            ) {


              clearContent();


              videoBox.classList.add(
                "photo-mode"
              );


              photoImage.src =
                photo;


              photoCaption.textContent =
                caption || "";


              photoCard.style.display =
                "block";


              modal.classList.add(
                "active"
              );


              return;

            }



            /* =========================
               LOCAL MP4
            ========================= */

            if (
              videoFile
            ) {


              clearContent();


              setVideoBoxStyle(
                shape,
                format
              );


              if (
                ringText
              ) {

                ringTextPath.textContent =
                  ringText;

              }


              localVideo.src =
                videoFile;


              localVideo.style.display =
                "block";


              modal.classList.add(
                "active"
              );


              localVideo
                .play()
                .catch(
                  () => {}
                );


              return;

            }



            /* =========================
               YOUTUBE
            ========================= */

            if (
              videoURL
            ) {


              clearContent();


              setVideoBoxStyle(
                shape,
                format
              );


              video.style.display =
                "block";


              const separator =
                videoURL.includes("?")
                  ? "&"
                  : "?";


              video.src =
                videoURL +
                separator +
                "autoplay=1";


              modal.classList.add(
                "active"
              );


              return;

            }



            /* =========================
               MESSAGE
            ========================= */

            if (
              messageText
            ) {


              clearContent();


              message.textContent =
                messageText;


              message.style.display =
                "flex";


              modal.classList.add(
                "active"
              );


            }


          }
        );


      }
    );



    /* ==================================================
       ЗАКРЫТИЕ
    ================================================== */

    function closeModal() {


      modal.classList.remove(
        "active"
      );


      clearContent();

    }


    closeButton.addEventListener(
      "click",
      closeModal
    );


    modal.addEventListener(
      "click",
      function (event) {


        if (
          event.target === modal
        ) {

          closeModal();

        }


      }
    );


    document.addEventListener(
      "keydown",
      function (event) {


        if (
          event.key === "Escape"
        ) {

          closeModal();

        }


      }
    );



    /* ==================================================
       РЕЖИМ ЭОС
    ================================================== */

    eosMode.addEventListener(
      "change",
      function () {


        document.body.classList.toggle(
          "eos-mode",
          eosMode.checked
        );


      }
    );
