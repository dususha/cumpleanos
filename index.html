    /* =========================
       ШРИФТЫ
    ========================= */

    @font-face {
      font-family: "Satyr SP";
      src: url("./SatyrSP.otf") format("opentype");
      font-weight: normal;
      font-style: normal;
    }

    @font-face {
      font-family: "UbuntuLI";
      src: url("./Ubuntu-LI.ttf") format("truetype");
      font-weight: normal;
      font-style: normal;
    }

    /* =========================
       ОБЩИЕ
    ========================= */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #F1CEB2;
      cursor: url("./cursor1.png") 16 16, auto;
    }

    .scene {
      position: relative;
      width: 100%;
      min-height: 1500px;
      overflow: hidden;
      padding-top: 180px;
    }

    /* =========================
       ЗАГОЛОВОК
    ========================= */

    .title {
      position: absolute;
      top: 35px;
      left: 50%;
      transform: translateX(-50%);
      width: 92%;
      text-align: center;
      z-index: 50;
    }

    .title h1 {
      margin: 0;
      font-family: "Satyr SP", serif;
      font-size: 72px;
      font-weight: normal;
      line-height: 1;
    }

    .title p {
      margin: 10px 0 0;
      font-family: "UbuntuLI", serif;
      font-size: 14px;
      font-weight: normal;
      line-height: 1.35;
    }

    /* =========================
       ОСНОВНЫЕ КАРТИНКИ
    ========================= */

    .object {
      position: absolute;
      z-index: 10;
      animation: float var(--dur, 4s) ease-in-out infinite;
    }

    .object[data-video],
    .object[data-file],
    .greeting[data-video],
    .greeting[data-file],
    .greeting[data-message] {
      cursor: pointer;
    }

    .object img,
    .greeting img {
      display: block;
      width: 100%;
      height: auto;
      transition: transform 0.25s ease, filter 0.25s ease;
    }

    .object img {
      transform: rotate(var(--rot, 0deg));
    }

    .object:hover {
      z-index: 20;
    }

    .object:hover img {
      transform: rotate(var(--rot, 0deg)) scale(1.12);
      filter: drop-shadow(0 18px 24px rgba(0, 0, 0, 0.25));
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-12px);
      }
    }

    /* =========================
       ПАСХАЛКИ
    ========================= */

    .greeting {
      position: absolute;
      z-index: 30;
      animation: greeting-float 4s ease-in-out infinite;
    }

    .greeting:hover {
      z-index: 40;
    }

    .greeting:hover img {
      animation: wiggle 0.6s ease-in-out 1;
      filter: drop-shadow(0 8px 10px rgba(0, 0, 0, 0.2));
    }

    @keyframes greeting-float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-6px);
      }
    }

    @keyframes wiggle {
      0% {
        transform: rotate(0deg) scale(1);
      }
      20% {
        transform: rotate(-14deg) scale(1.12);
      }
      40% {
        transform: rotate(12deg) scale(1.12);
      }
      60% {
        transform: rotate(-9deg) scale(1.12);
      }
      80% {
        transform: rotate(6deg) scale(1.08);
      }
      100% {
        transform: rotate(0deg) scale(1);
      }
    }

    .video-box {

      background: #1f1b18;

    .video-box.circle {

      aspect-ratio: 1 / 1;
      background: transparent;
    }

    .video-box.circle video,
    .video-box.circle iframe {

      height: 100%;
      border-radius: 50%;
      border: 8px solid #b85f2d;

  <div class="modal" id="modal">
    <div class="video-box">

      <button class="close" id="close" type="button" aria-label="Закрыть">
        ×
      </button>

      <video id="localVideo" controls playsinline></video>

      <iframe
        id="video"
        src=""
        title="Видео-поздравление"
        allow="autoplay; encrypted-media; picture-in-picture"
        allowfullscreen
      ></iframe>

      <div id="message"></div>

    </div>
  </div>

  <script>
    const objects =
      document.querySelectorAll("[data-video], [data-file], [data-message]");

    const modal =
      document.getElementById("modal");

    const video =
      document.getElementById("video");

    const localVideo =
      document.getElementById("localVideo");

    const message =
      document.getElementById("message");

    const closeButton =
      document.getElementById("close");

    const videoBox =
      document.querySelector(".video-box");

    objects.forEach(object => {
      object.addEventListener("click", function () {
        const videoURL = object.dataset.video;
        const videoFile = object.dataset.file;
        const messageText = object.dataset.message;
        const shape = object.dataset.shape;

        /* ЛОКАЛЬНОЕ MP4 */
        if (videoFile) {
          video.src = "";
          video.style.display = "none";

          message.textContent = "";
          message.style.display = "none";

          if (shape === "circle") {
            videoBox.classList.add("circle");
          } else {
            videoBox.classList.remove("circle");
          }

          localVideo.src = videoFile;
          localVideo.style.display = "block";

          modal.classList.add("active");

          localVideo.play().catch(() => {});
          return;
        }

        /* YOUTUBE */
        if (videoURL) {
          localVideo.pause();
          localVideo.removeAttribute("src");
          localVideo.load();
          localVideo.style.display = "none";

          message.textContent = "";
          message.style.display = "none";

          if (shape === "circle") {
            videoBox.classList.add("circle");
          } else {
            videoBox.classList.remove("circle");
          }

          video.style.display = "block";
          video.src = videoURL + "?autoplay=1";

          modal.classList.add("active");
          return;
        }

        /* ТЕКСТ */
        if (messageText) {
          video.src = "";
          video.style.display = "none";

          localVideo.pause();
          localVideo.removeAttribute("src");
          localVideo.load();
          localVideo.style.display = "none";

          videoBox.classList.remove("circle");

          message.textContent = messageText;
          message.style.display = "flex";

          modal.classList.add("active");
        }
      });
    });

    function closeModal() {
      modal.classList.remove("active");

      video.src = "";
      video.style.display = "none";

      localVideo.pause();
      localVideo.removeAttribute("src");
      localVideo.load();
      localVideo.style.display = "none";

      message.textContent = "";
      message.style.display = "none";

      videoBox.classList.remove("circle");
    }

    closeButton.addEventListener("click", closeModal);

    modal.addEventListener("click", function (event) {
      if (event.target === modal) {
        closeModal();
      }
    });

    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape") {
        closeModal();
      }
    });
  </script>
</body>

</html>
